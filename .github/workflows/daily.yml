name: 영상(BT) 광고 아카이브 자동 갱신

on:
  schedule:
    # KST 기준 매일 오전 8시 (UTC 23시). 대시보드는 오전 7~8시에 보므로 그 전에 갱신.
    - cron: "0 23 * * *"
  workflow_dispatch:       # 수동 실행 버튼
    inputs:
      MONTH_TAG:
        description: "수동 수집할 월 태그 (예: 26.10 또는 26.08~26.10). 비우면 최근 3개월 자동."
        required: false
        default: ""
      DATE_START:
        description: "직접 지정 시작일 (YYYY-MM-DD, 선택)"
        required: false
        default: ""
      DATE_STOP:
        description: "직접 지정 종료일 (YYYY-MM-DD, 선택)"
        required: false
        default: ""

# 같은 워크플로우가 겹쳐 돌지 않도록 (push 충돌 방지)
concurrency:
  group: ad-archive-video
  cancel-in-progress: false

permissions:
  contents: write          # 결과 커밋/푸시용

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 광고 데이터 수집 & HTML 생성
        env:
          META_ACCESS_TOKEN:  ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID:   ${{ secrets.SLACK_CHANNEL_ID }}
          # 정기 실행이면 최근 3개월 아카이브 자동 갱신
          AUTO_ARCHIVE:       ${{ github.event_name == 'schedule' && '1' || '' }}
          MONTH_TAG:          ${{ github.event.inputs.MONTH_TAG }}
          DATE_START:         ${{ github.event.inputs.DATE_START }}
          DATE_STOP:          ${{ github.event.inputs.DATE_STOP }}
        run: python fetch_ads.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          TS=$(TZ=Asia/Seoul date "+%Y-%m-%d %H:%M KST")
          git commit -m "chore: [자동갱신] 영상(BT) 광고 아카이브 업데이트 ${TS}" || echo "변경사항 없음"
          git push
